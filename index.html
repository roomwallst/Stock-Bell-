<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a52">
<title>도전! 주식벨 복습 퀴즈</title>
<style>
:root{
  --bg:#f4f7fb;--card:#fff;--ink:#14213d;--mut:#667085;--line:#dfe6f0;
  --brand:#1f5eff;--brandInk:#fff;--ok:#12a36b;--okBg:#e6f7ef;--bad:#e5484d;--badBg:#fdecec;--track:#dfe6f0;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1626;--card:#162238;--ink:#eef3fb;--mut:#9db0cc;--line:#26344d;
    --brand:#5b8cff;--brandInk:#0d1626;--ok:#38d39b;--okBg:#12372c;--bad:#ff7b80;--badBg:#3b1c20;--track:#26344d}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px env(safe-area-inset-bottom,0)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0) + 14px) 0 10px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--mut);margin-bottom:8px}
.hrow b{color:var(--ink);font-size:17px}
.track{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .35s ease}
main{flex:1;padding:12px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--brand);margin-bottom:10px}
.q{font-size:22px;font-weight:800;line-height:1.4;margin:0;word-break:keep-all}
.opts{display:grid;gap:12px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:14px 16px;text-align:left;font:inherit;font-size:18px;font-weight:600;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;cursor:pointer;word-break:keep-all;transition:transform .08s,border-color .15s}
.opt:active:not(:disabled){transform:scale(.98)}
.opt .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--mut)}
.opt.ox{justify-content:center;font-size:32px;min-height:88px;font-weight:800}
.oxrow{grid-template-columns:1fr 1fr}
.opt.ok{border-color:var(--ok);background:var(--okBg)}
.opt.bad{border-color:var(--bad);background:var(--badBg)}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
.fb{margin-top:16px;border-radius:16px;padding:16px 18px;font-size:16px}
.fb.ok{background:var(--okBg)}.fb.bad{background:var(--badBg)}
.fb h3{margin:0 0 4px;font-size:18px}
.fb.ok h3{color:var(--ok)}.fb.bad h3{color:var(--bad)}
.fb p{margin:0;word-break:keep-all}
footer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 28%);padding:14px 0 calc(env(safe-area-inset-bottom,0) + 14px)}
.btn{display:block;width:100%;min-height:58px;border:0;border-radius:16px;background:var(--brand);color:var(--brandInk);font:inherit;font-size:19px;font-weight:800;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand);margin-top:10px}
.btn:active{transform:scale(.98)}
.done{text-align:center}
.done .emoji{font-size:56px}
.done h1{margin:6px 0 4px;font-size:30px}
.done .sub{color:var(--mut);margin:0 0 18px}
.concepts{list-style:none;margin:0;padding:0;text-align:left;display:grid;gap:10px}
.concepts li{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:16px;word-break:keep-all}
.concepts b{display:block;font-size:17px}
.recheck{display:inline-block;margin-left:6px;font-size:12px;font-weight:800;color:var(--bad);background:var(--badBg);border-radius:99px;padding:1px 8px;vertical-align:1px}
h2{font-size:18px;margin:22px 0 10px;text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow"><span>도전! 주식벨 복습</span><span><b id="cur">1</b> / <span id="tot">10</span></span></div>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="pb"><div class="fill" id="fill"></div></div>
  </header>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<script>
const QUIZ = [
  {q:"방구석월가 유튜브 채널주소는?",o:["Rwallst","Banguseok","Roomwallst","Bangwallst"],a:2,exp:"정답은 Roomwallst예요. 채널을 검색하거나 주소를 입력할 때 철자를 꼭 확인하세요.",concept:["학습 채널 주소","방구석월가 채널 주소는 Roomwallst"]},
  {q:"다음 중 올바른 ETF의 약자는?",o:["Emart Traders Fund","Emart Total Fund","Exchange Traded Fund","Exchange Total Fund"],a:2,exp:"ETF는 Exchange Traded Fund, 즉 거래소에 상장되어 주식처럼 사고팔 수 있는 펀드(상장지수펀드)예요.",concept:["ETF","거래소에 상장되어 주식처럼 거래되는 펀드"]},
  {q:"S&P500 지수 연 평균 수익률은?",o:["7%","22%","30%","10%"],a:3,exp:"S&P500은 장기적으로 연평균 약 10% 수준의 수익률을 보여왔어요. 과거 평균일 뿐, 매년 같은 수익이 나거나 미래가 보장되는 건 아니에요.",concept:["S&P500 장기 수익률","과거 연평균 약 10%, 단 미래 보장은 아님"]},
  {q:"시간이 내편이 되는 건 투기다?",ox:true,o:["O","X"],a:1,exp:"X예요. 시간이 내 편이 되는 건 장기 투자예요. 시간이 쌓일수록 복리 효과가 커지는 게 투자의 강점이에요.",concept:["장기 투자와 복리","시간이 쌓일수록 복리 효과가 커짐"]},
  {q:"주가가 떨어지면 무조건 싼 주식이다?",ox:true,o:["O","X"],a:1,exp:"X예요. 주가가 내려갔다고 싼 게 아니에요. 기업의 가치와 실적에 비해 가격이 낮은지를 따져봐야 해요.",concept:["싼 주식의 기준","주가 하락 ≠ 저평가, 기업 가치와 비교"]},
  {q:"다음 중 필수소비재가 아닌 것은?",o:["현대자동차","코카콜라","펩시","오뚜기"],a:0,exp:"자동차는 경기에 따라 소비가 달라지는 경기소비재예요. 음료·식품처럼 경기와 상관없이 꾸준히 쓰는 게 필수소비재예요.",concept:["필수소비재 vs 경기소비재","음료·식품은 필수, 자동차는 경기소비재"]},
  {q:"다음 중 안전 자산이 아닌 것은?",o:["금","부동산","주식","달러"],a:2,exp:"주식은 가격 변동이 큰 위험 자산이에요. 금이나 달러는 불안한 시기에 상대적으로 안전하다고 여겨지는 자산이에요.",concept:["안전 자산 vs 위험 자산","주식은 변동성이 큰 위험 자산"]},
  {q:"레버리지는 오를 때 2배, 내릴 때도 2배다?",ox:true,o:["O","X"],a:0,exp:"O예요. 레버리지 상품은 수익도 손실도 같은 배수로 커져요. 오래 들고 있으면 기대와 다르게 움직일 수 있어 주의가 필요해요.",concept:["레버리지","수익도 손실도 배수로 커지는 양날의 검"]},
  {q:"다음 중 다우존스 30에 편입된 주식이 아닌 것은?",o:["스타벅스","맥도날드","애플","디즈니"],a:0,exp:"스타벅스는 다우존스 30 종목이 아니에요. 맥도날드, 애플, 디즈니는 다우존스 30에 포함된 대표 기업이에요.",concept:["다우존스 30","미국 대표 대형 우량주 30개로 구성된 지수"]},
  {q:"장기투자에 가장 필요한 능력은?",o:["시장이 흔들려도 자신의 투자 원칙을 지키는 능력","내일 오를 주식을 맞추는 능력","매일 주가를 확인하는 능력","가장 높은 수익률의 종목을 찾는 능력"],a:0,exp:"장기투자의 핵심은 예측이 아니라 원칙이에요. 시장이 흔들려도 내 기준을 지키는 힘이 가장 중요해요.",concept:["장기투자의 핵심","예측보다 원칙, 흔들려도 지키는 힘"]}
];
const $=id=>document.getElementById(id);const main=$("main"),foot=$("foot");let idx=0,answered=false;const missed=new Set();$("tot").textContent=QUIZ.length;
function setProgress(done){$("fill").style.width=(done/QUIZ.length*100)+"%";$("pb").setAttribute("aria-valuenow",done)}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function showQuestion(){const d=QUIZ[idx];answered=false;$("cur").textContent=idx+1;setProgress(idx);main.innerHTML='<div class="card"><span class="tag">'+(d.ox?"OX 문제 ":"문제 ")+(idx+1)+'</span><h1 class="q">'+esc(d.q)+'</h1><div class="opts'+(d.ox?" oxrow":"")+'" id="opts">'+d.o.map((t,i)=>'<button class="opt'+(d.ox?" ox":"")+'" data-i="'+i+'">'+(d.ox?"":'<span class="n">'+(i+1)+'</span>')+'<span>'+esc(t)+'</span></button>').join("")+'</div><div id="fb" aria-live="polite"></div></div>';foot.innerHTML="";main.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.i)));window.scrollTo(0,0)}
function choose(i){if(answered)return;answered=true;const d=QUIZ[idx],right=i===d.a;if(!right)missed.add(idx);const btns=main.querySelectorAll(".opt");btns.forEach((b,k)=>{b.disabled=true;if(k===d.a)b.classList.add("ok");else if(k===i)b.classList.add("bad")});$("fb").innerHTML='<div class="fb '+(right?"ok":"bad")+'"><h3>'+(right?"🎯 정답이에요!":"다시 확인해봐요")+'</h3><p>'+esc(d.exp)+'</p></div>';setProgress(idx+1);const last=idx===QUIZ.length-1;foot.innerHTML='<button class="btn" id="next">'+(last?"복습 마무리하기":"다음 문제")+'</button>';$("next").addEventListener("click",()=>{last?showDone():(idx++,showQuestion())});$("fb").scrollIntoView({behavior:"smooth",block:"nearest"})}
function showDone(){setProgress(QUIZ.length);$("cur").textContent=QUIZ.length;main.innerHTML='<div class="card done"><div class="emoji">🎉</div><h1>복습 완료!</h1><p class="sub">오늘 배운 핵심 개념을 한 번 더 확인해요</p><ul class="concepts">'+QUIZ.map((d,i)=>'<li><b>'+esc(d.concept[0])+(missed.has(i)?'<span class="recheck">다시 확인</span>':'')+'</b>'+esc(d.concept[1])+'</li>').join("")+'</ul></div>';foot.innerHTML='<button class="btn ghost" id="again">처음부터 다시 풀기</button>';$("again").addEventListener("click",()=>{idx=0;missed.clear();showQuestion()});window.scrollTo(0,0)}
showQuestion();
</script>
</body>
</html>
