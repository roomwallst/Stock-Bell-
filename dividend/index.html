 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><polygon points="${X(0)},${H-24} ${pts} ${X(5)},${H-24}" fill="${col}" opacity=".13"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5"/>${v.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x)}" r="3.5" fill="${col}"/><text x="${X(i)}" y="${Y(x)-8}" text-anchor="middle" font-size="9.5" fill="#e8edf6">${fk(x)}</text><text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#8696b3">${i}년차</text>`).join('')}</svg>`;
}
function vt(){
 const{h,inv}=tot(),L=live(h);
 let b=`<h2>배당 타임머신</h2><div class="nt">최근 5년 CAGR이 향후에도 동일하게 지속된다고 가정한 교육용 시뮬레이션입니다. 실제 미래 주가와 배당을 예측하거나 보장하지 않습니다.</div>`;
 if(!L.length)return $('#v').innerHTML=b+emp();
 b+=`<button class="b big" onclick="tm=1;vt();window.scrollTo(0,0)">5년 뒤 내 포트폴리오 보기</button>`;
 if(tm){
  const hasP=L.every(x=>x.pc!=null),V=[],D=[];for(let y=0;y<=5;y++){if(hasP)V.push(L.reduce((a,x)=>a+x.sh*x.p*Math.pow(1+x.pc/100,y),0));D.push(L.reduce((a,x)=>a+x.sh*x.d*Math.pow(1+x.dc/100,y),0))}
  const r=(l,a,c,cl='')=>`<div>${l}</div><div>${a}</div><b class="${cl}">${c}</b>`;
  b+=`<div class="box"><div class="cmp"><div class="h"></div><div class="h">현재</div><div class="h">5년 후 예상</div>
  ${r('포트폴리오 가치',f0(inv),hasP?f0(V[5]):'-','ac')}${r('연간 배당',f0(D[0]),f0(D[5]),'ac')}${r('월평균 배당',f0(D[0]/12),f0(D[5]/12))}${r('배당률(투자금 대비)',f1(D[0]/inv*100),f1(D[5]/inv*100),'up')}</div>
  <div class="mu" style="margin-top:10px">현재 투자원금 ${f0(CAP)} · 현재 포트폴리오 평가 기준금액 ${f0(inv)} · 남은 현금 ${f0(CAP-inv)}(5년 후 계산에서 제외)<br>5년 후 배당률은 실제 매수금액 기준 Yield on Cost입니다.</div></div>
  <h3>예상 포트폴리오 평가금액 변화</h3><div class="box">${hasP?lc(V,'#5aa9ff'):'<div class="mu">5년 주가 CAGR 데이터가 없는 종목이 있어 평가금액은 계산하지 않았어요.</div>'}</div>
  <h3>예상 연간 배당금 변화</h3><div class="box">${lc(D,'#f2c14e')}</div>
  <div class="nt">배당 = 보유주식수 × 연간배당액 × (1+배당 CAGR)^n, 가치 = 보유주식수 × 현재주가 × (1+주가 CAGR)^n 로 계산한 단순 시뮬레이션입니다.${L.some(x=>x.pe)?' 5년 주가 CAGR은 개략 추정치입니다.':''}</div>`;
 }
 $('#v').innerHTML=b;
}
const V={h:vh,x:vx,p:vp,c:vc,a:va,t:vt};

/* ===== 시작 ===== */
function boot(){pf=Object.fromEntries(Object.entries(pf).filter(([t])=>STOCKS.some(s=>s.t==t)));if(tot().inv>CAP){pf={};sv()}hd();go(tab)}
boot();
fetch('stocks.csv').then(r=>r.ok?r.text():Promise.reject()).then(t=>{const d=parseCSV(t);if(d.length){STOCKS=d;boot()}}).catch(()=>{});
</script>
